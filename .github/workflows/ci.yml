name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create analysis environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify Python, R, and DESeq2
        run: |
          python --version
          Rscript -e 'cat(R.version.string, "\n")'
          Rscript -e 'suppressPackageStartupMessages(library(DESeq2)); cat("DESeq2", as.character(packageVersion("DESeq2")), "\n")'

      - name: Lint Python code
        run: python -m ruff check .

      - name: Run Python tests
        run: python -m pytest -v

      - name: Run DESeq2 integration test
        run: |
          output_dir="${RUNNER_TEMP}/deseq2-output"
          Rscript scripts/run_deseq2.R \
            examples/example2/counts.tsv \
            examples/example2/metadata.csv \
            control \
            dexamethasone \
            "${output_dir}"
          test -s "${output_dir}/deseq2_dexamethasone_vs_control.csv"
